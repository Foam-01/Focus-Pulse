<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="3" />
  
  <!-- Outer Timer Ring -->
  <circle cx="50" cy="54" r="28" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" />
  <circle cx="50" cy="54" r="28" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-dasharray="175.9" stroke-dashoffset="40" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Top Timer Button -->
  <rect x="44" y="15" width="12" height="6" rx="3" fill="url(#iconGrad)" />
  
  <!-- Inner Pulse Line -->
  <path d="M 35 54 L 43 54 L 47 44 L 53 64 L 57 49 L 61 54 L 65 54" fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
